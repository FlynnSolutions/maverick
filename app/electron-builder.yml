# The macOS build. Run from app/: `npm run build`. The application directory is the repo root so
# the packaged app carries server.ts, src/, web/ and bin/ exactly as a clone does, and nothing
# else. Plain files, no asar archive: python3 runs bin/ptybridge.py by path, and nothing here is
# big enough for the archive to buy anything.
appId: com.flynnsolutions.maverick
productName: Maverick
directories:
  app: ..
extraMetadata:
  main: app/main.mjs
files:
  - server.ts
  - src/**
  - web/**
  - bin/**
  - app/main.mjs
asar: false
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  # No Apple developer certificate. An ad-hoc signature is what lets the bundle run at all on
  # Apple silicon once the quarantine flag is cleared; the README says how. Hardened runtime only
  # matters for notarisation, and with an ad-hoc signature it makes the launch fail library
  # validation.
  identity: "-"
  hardenedRuntime: false
