<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Session Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="bar">
    <a href="/" class="brand">Session Console</a>
    <select id="switcher" class="switcher" hidden aria-label="Project"></select>
    <span id="view-toggle" class="segmented" hidden>
      <button type="button" data-view="board">Board</button>
      <button type="button" data-view="calendar">Calendar</button>
    </span>
    <label class="toggle" id="scope-toggle" hidden>
      <input type="checkbox" id="show-all" />
      <span>show non-dev items</span>
    </label>
    <span id="status" class="status" role="status"></span>
    <button id="new-session" type="button" class="primary" hidden>New session</button>
    <button id="reload" type="button" hidden>Reload</button>
  </header>

  <main id="picker" class="picker" hidden>
    <h1>Pick a project</h1>
    <ul id="project-list" class="project-list"></ul>
    <div class="picker-actions">
      <button id="import" type="button" class="primary">Import a directory from Finder</button>
      <form id="add-path" class="add-path">
        <input name="path" type="text" placeholder="or paste an absolute path" />
        <button type="submit">Add</button>
      </form>
    </div>
  </main>

  <main id="project" class="project" hidden>
    <section id="boards" class="boards"></section>
    <aside class="dispatch">
      <h2 class="lane-title"><button id="rail-fold" type="button" class="ghost fold">▾</button><span class="label">Sessions</span><button id="refresh-live" type="button" class="ghost">refresh</button></h2>
      <div id="sessions"></div>
      <div id="live"></div>
    </aside>
  </main>

  <div id="drawer-root"></div>

  <section id="dock" class="dock" hidden>
    <div class="dock-tabs" id="dock-tabs"></div>
    <div class="dock-body" id="dock-body"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
