<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maverick</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="bar">
    <a href="/" class="brand" aria-label="Maverick"><span id="brand-mark" class="mark"></span><span class="wm">Maverick</span></a>
    <span id="project-pick" class="pick" hidden></span>
    <nav id="view-toggle" class="nav" hidden aria-label="View"></nav>
    <span id="status" class="status" role="status"></span>
    <span class="tools">
      <button id="new-session" type="button" class="primary" hidden></button>
      <button id="reload" type="button" hidden></button>
    </span>
  </header>

  <main id="picker" class="picker" hidden>
    <h1>Pick a project</h1>
    <ul id="project-list" class="project-list"></ul>
    <div class="picker-actions">
      <button id="import" type="button" class="primary">Import a directory from Finder</button>
      <form id="add-path" class="add-path">
        <input name="path" type="text" placeholder="or paste an absolute path" />
        <button type="submit">Add</button>
      </form>
    </div>
  </main>

  <main id="project" class="project" hidden>
    <section id="boards" class="boards"></section>
    <aside class="dispatch">
      <h2 class="lane-title"><button id="rail-fold" type="button" class="ghost fold">▾</button><span class="label">Sessions</span><button id="refresh-live" type="button" class="ghost">refresh</button></h2>
      <div id="tally"></div>
      <div id="sessions"></div>
      <div id="live"></div>
    </aside>
  </main>

  <div id="drawer-root"></div>

  <section id="dock" hidden>
    <div class="dock-head">
      <div class="dock-tabs" id="dock-tabs"></div>
      <span class="dock-gap"></span>
      <span class="dock-ctl" id="dock-ctl"></span>
    </div>
    <div class="dock-body" id="dock-body"></div>
  </section>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
