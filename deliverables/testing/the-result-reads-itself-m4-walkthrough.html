<!doctype html>
<meta charset="utf-8">
<title>The result reads itself: milestone 4 walkthrough</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#1a1d21; --muted:#5b636c; --faint:#8a929b;
    --line:#e4e7eb; --line2:#eef1f4; --accent:#0284a8; --accent-soft:#e6f4f9;
    --good:#1b8a5a; --good-soft:#e7f5ee; --warn:#b26a00; --warn-soft:#fdf3e2;
    --setup:#6d4bb6; --setup-soft:#f0ebfa; --done:#9aa2ab;
    --radius:10px; --maxw:1000px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1216; --panel:#171b21; --ink:#e7eaee; --muted:#9aa3ad; --faint:#6b747e;
      --line:#262c34; --line2:#1f242b; --accent:#39b6d8; --accent-soft:#123039;
      --good:#4cc38a; --good-soft:#10281d; --warn:#e0a44a; --warn-soft:#2c2113;
      --setup:#b79df0; --setup-soft:#211a33; --done:#5b636c;
    }
  }
  :root[data-theme="light"]{
    --bg:#f6f7f9; --panel:#fff; --ink:#1a1d21; --muted:#5b636c; --faint:#8a929b;
    --line:#e4e7eb; --line2:#eef1f4; --accent:#0284a8; --accent-soft:#e6f4f9;
    --good:#1b8a5a; --good-soft:#e7f5ee; --warn:#b26a00; --warn-soft:#fdf3e2;
    --setup:#6d4bb6; --setup-soft:#f0ebfa; --done:#9aa2ab;
  }
  :root[data-theme="dark"]{
    --bg:#0f1216; --panel:#171b21; --ink:#e7eaee; --muted:#9aa3ad; --faint:#6b747e;
    --line:#262c34; --line2:#1f242b; --accent:#39b6d8; --accent-soft:#123039;
    --good:#4cc38a; --good-soft:#10281d; --warn:#e0a44a; --warn-soft:#2c2113;
    --setup:#b79df0; --setup-soft:#211a33; --done:#5b636c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.86em;
    background:var(--line2);padding:.08em .38em;border-radius:5px;border:1px solid var(--line);
    word-break:break-word;}
  a{color:var(--accent)}
  pre{overflow-wrap:anywhere}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px 120px}
  header.mast{max-width:var(--maxw);margin:0 auto;padding:36px 20px 20px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1{font-size:30px;line-height:1.15;margin:.28em 0 .1em;letter-spacing:-.01em;text-wrap:balance}
  .sub{color:var(--muted);font-size:15px;max-width:72ch}
  .meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px;font-size:13px;color:var(--muted)}
  .meta b{color:var(--ink);font-weight:600}
  .progwrap{position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:6px}
  .progrow{max-width:var(--maxw);margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px}
  .bar{flex:1;height:8px;background:var(--line2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
  .pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
  .tools{display:flex;gap:8px}
  button.btn{font:inherit;font-size:12.5px;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
  button.btn:hover{color:var(--ink);border-color:var(--accent)}
  .callout{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:var(--radius);padding:16px 18px;margin:18px 0}
  .callout h3{margin:0 0 8px;font-size:15px}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13.5px;margin-top:4px}
  .kv dt{color:var(--muted)} .kv dd{margin:0}
  nav.toc{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 16px;margin:18px 0 6px}
  nav.toc ol{margin:0;padding-left:20px;columns:2;column-gap:28px}
  @media(max-width:640px){nav.toc ol{columns:1}}
  nav.toc li{margin:4px 0;break-inside:avoid}
  nav.toc a{text-decoration:none;color:var(--ink)}
  nav.toc a:hover{color:var(--accent)}
  nav.toc .c{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px}
  section.pillar{margin:30px 0 0}
  .phead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    padding:10px 0 8px;border-bottom:2px solid var(--line);position:sticky;top:44px;background:var(--bg);z-index:5}
  .phead h2{margin:0;font-size:21px;letter-spacing:-.01em}
  .phead .pc{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .tc{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    margin:12px 0;overflow:hidden}
  .tc-head{display:flex;gap:11px;align-items:flex-start;padding:13px 40px 13px 15px;cursor:pointer;user-select:none;position:relative}
  .tc-head:after{content:"\25BE";position:absolute;right:15px;top:13px;color:var(--faint);transition:transform .15s}
  .tc-head:hover:after{color:var(--accent)}
  .tc.collapsed .tc-head:after{transform:rotate(-90deg)}
  .tc-title{font-weight:600;font-size:15px;flex:1}
  .caseid{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
    font-weight:700;color:var(--muted);background:var(--line2);border:1px solid var(--line);
    border-radius:5px;padding:0 6px;margin-right:8px;vertical-align:1px}
  .tc-actions{display:inline-flex;gap:8px;align-items:center;margin-left:auto;flex:none}
  .verdict{display:inline-flex;gap:3px}
  .vbtn{font:inherit;font-size:13px;font-weight:800;width:27px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--faint);cursor:pointer;line-height:1;padding:0}
  .vbtn:hover{border-color:var(--accent);color:var(--ink)}
  .vbtn.v-pass.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
  .vbtn.v-partial.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
  .vbtn.v-fail.on{background:#fdecec;border-color:#e0554c;color:#b3261e}
  :root[data-theme="dark"] .vbtn.v-fail.on{background:#2c1514;color:#f0918a;border-color:#7a3b36}
  .vbtn.v-blocked.on{background:var(--line2);border-color:var(--faint);color:var(--ink)}
  .vbtn.v-defer.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .notebtn{font:inherit;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;white-space:nowrap}
  .notebtn:hover{border-color:var(--accent);color:var(--accent)}
  .notebtn.has{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .notebtn.sendbtn.sent{color:var(--good);border-color:var(--good);background:var(--good-soft)}
  .vchip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--setup);
    background:var(--setup-soft);border:1px solid var(--setup);border-radius:5px;padding:0 5px;margin-left:7px;vertical-align:1px}
  .notearea{width:100%;font:inherit;font-size:13px;border:1px solid var(--warn);border-radius:7px;padding:7px 9px;margin:0 0 11px;background:var(--warn-soft);color:var(--ink);resize:vertical;box-sizing:border-box}
  .tc[data-v="pass"]{border-left:3px solid var(--good)}
  .tc[data-v="partial"]{border-left:3px solid var(--warn)}
  .tc[data-v="fail"]{border-left:3px solid #d3453b}
  .tc[data-v="blocked"]{border-left:3px solid var(--faint)}
  .tc[data-v="defer"]{border-left:3px solid var(--accent)}
  #breakdown{display:inline-flex;gap:9px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
  #breakdown .p{color:var(--good)} #breakdown .pa{color:var(--warn)} #breakdown .f{color:#d3453b} #breakdown .bl{color:var(--muted)}
  #barFill{width:100%;height:100%;background:transparent;display:flex}
  .bar .seg{height:100%;display:block}
  .bar .seg-pass{background:var(--good)} .bar .seg-partial{background:var(--warn)}
  .bar .seg-blocked{background:var(--faint)} .bar .seg-fail{background:#d3453b}
  .progrow.filters{margin-top:9px;gap:8px;flex-wrap:wrap}
  .flabel{font-size:12.5px;color:var(--muted)} .flabel b{color:var(--ink);font-weight:600}
  .fchip{font:inherit;font-size:12.5px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 13px;cursor:pointer;color:var(--muted)}
  .fchip:hover{border-color:var(--accent)}
  .fchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
  .cpanel{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
  .cbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .chead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
  .chead .csub{color:var(--muted);font-size:12.5px}
  #compileText{flex:1;min-height:340px;border:0;padding:14px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;background:var(--bg);color:var(--ink);resize:none;outline:none}
  .tc.done .tc-title{color:var(--done);text-decoration:line-through;text-decoration-thickness:1px}
  .tc-body{padding:0 15px 14px 43px;font-size:14px}
  .tc.collapsed .tc-body{display:none}
  .why{color:var(--muted);margin:0 0 10px}
  .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:2px 7px;border-radius:5px;margin-right:7px;vertical-align:1px}
  .tag.setup{background:var(--setup-soft);color:var(--setup)}
  .tag.ask{background:var(--warn-soft);color:var(--warn)}
  .setup-line{background:var(--setup-soft);border:1px solid var(--line);border-radius:7px;
    padding:7px 11px;margin:0 0 10px;font-size:13.5px}
  .ask-line{background:var(--warn-soft);border:1px solid var(--warn);border-radius:7px;
    padding:7px 11px;margin:0 0 10px;font-size:13.5px}
  .auto-note{background:var(--accent-soft);border:1px solid var(--line);border-radius:7px;
    padding:6px 11px;margin:0 0 10px;font-size:12.5px;color:var(--muted)}
  .auto-note b{color:var(--ink)}
  .hist{background:var(--line2);border:1px solid var(--line);border-left:3px solid var(--faint);
    border-radius:7px;padding:7px 11px;margin:0 0 9px;font-size:12.5px;color:var(--muted)}
  .hist .hr{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--faint);margin-bottom:3px}
  .hist p{margin:0 0 6px}
  .hist p:last-child{margin-bottom:0}
  .notearea::placeholder{color:var(--faint)}
  .fix-note{background:var(--good-soft);border:1px solid var(--good);border-radius:7px;
    padding:7px 11px;margin:0 0 11px;font-size:12.5px;color:var(--ink)}
  .fix-note b{color:var(--good)}
  .fix-note.pending{background:var(--warn-soft);border-color:var(--warn)}
  .fix-note.pending b{color:var(--warn)}
  .lbl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin:10px 0 4px}
  ol.steps{margin:0 0 4px;padding-left:20px} ol.steps li{margin:4px 0}
  ul.exp{margin:0;padding-left:0;list-style:none}
  ul.exp li{margin:5px 0;padding-left:22px;position:relative}
  ul.exp li:before{content:"\2713";position:absolute;left:2px;color:var(--good);font-weight:800}
  .exp-wrap{background:var(--good-soft);border:1px solid var(--line);border-radius:7px;padding:9px 12px;margin-top:4px}
  .guide{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;background:var(--line2);
    border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin:0 0 12px;font-size:13px}
  .guide .who b{color:var(--accent)}
  .guide .sep{color:var(--muted)}
  .glink{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;padding:3px 10px;color:var(--accent);text-decoration:none;font-weight:600;font-size:12.5px}
  .glink:hover{border-color:var(--accent);background:var(--accent-soft)}
  .glink:before{content:"\2197";font-size:11px}
  .pswitch{font-weight:650;text-decoration:none;border-bottom:1px dashed currentColor}
  .pswitch:hover{opacity:.75}
  @media(max-width:640px){
    .progrow{flex-wrap:wrap} .tools{flex-wrap:wrap}
    .tc-head{flex-wrap:wrap} .tc-actions{flex-wrap:wrap;margin-left:0}
    .tc-body{padding-left:15px}
  }
</style>
